services:
  - type: web
    name: ev-market-insights
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: TABLEAU_DASHBOARD_URL
        sync: false
      - key: TABLEAU_STORY_URL
        sync: false
